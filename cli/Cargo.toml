# Standalone on purpose: the server image should not carry an HTTP client and
# an argument parser it never uses.
[workspace]

[package]
name = "toolsite-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "toolsite"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
tar = "0.4"

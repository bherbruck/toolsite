# Deploys this project to toolsite on every push. Written by toolsite when
# the repository was connected; TOOLSITE_URL and TOOLSITE_DEPLOY_TOKEN are
# repository secrets it set, and the token can publish this one app only.
#
# What runs is decided by what the project contains:
#   package.json            npm ci && npm run build, then dist/ is the bundle
#   handler/Cargo.toml      a wasm handler, built for wasm32-wasip2
#   migrations/*.sql        the app's schema, applied before anything answers
#   toolsite.toml           the app's settings; spa = true marks the bundle
#   index.html with no build  a single page
# The project itself is stored with the app afterwards, so the next session
# can pick it up.
name: Deploy to toolsite

on:
  push:
    branches: ["__BRANCH__"]
  workflow_dispatch:

concurrency:
  group: toolsite-__APP__
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TOOLSITE_APP: "__APP__"
      TOOLSITE_URL: ${{ secrets.TOOLSITE_URL }}
      TOOLSITE_DEPLOY_TOKEN: ${{ secrets.TOOLSITE_DEPLOY_TOKEN }}
    defaults:
      run:
        working-directory: "__WORKDIR__"
    steps:
      - uses: actions/checkout@v4

      - name: Node
        if: hashFiles('__DIR__package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "__DIR__package-lock.json"

      - name: Build the front end
        if: hashFiles('__DIR__package.json') != ''
        run: |
          npm ci
          npm run build

      - name: Rust
        if: hashFiles('__DIR__handler/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build the handler
        if: hashFiles('__DIR__handler/Cargo.toml') != ''
        run: cargo build --release --target wasm32-wasip2 --manifest-path handler/Cargo.toml

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          put() {
            # $1 is a file or - for stdin; $2 is the flag, e.g. ?bundle
            curl -fsS -H "Authorization: Bearer $TOOLSITE_DEPLOY_TOKEN" \
              -T "$1" "$TOOLSITE_URL/deploy/$TOOLSITE_APP$2"
          }
          if [ -d migrations ] && ls migrations/*.sql >/dev/null 2>&1; then
            tar -czf - -C migrations . | put - '?migrations'
          fi
          if [ -f toolsite.toml ]; then
            put toolsite.toml '?manifest'
          fi
          spa=''
          if [ -f toolsite.toml ] && grep -Eq '^[[:space:]]*spa[[:space:]]*=[[:space:]]*true' toolsite.toml; then
            spa='&spa'
          fi
          if [ -d dist ]; then
            tar -czf - -C dist . | put - "?bundle$spa"
          elif [ -f index.html ]; then
            put index.html ''
          fi
          wasm=$(ls handler/target/wasm32-wasip2/release/*.wasm 2>/dev/null | head -n 1 || true)
          if [ -n "$wasm" ]; then
            put "$wasm" '?handler'
          fi
          tar -czf - --exclude node_modules --exclude target --exclude dist --exclude .git . | put - '?source'
          echo "deployed $TOOLSITE_APP to $TOOLSITE_URL/p/$TOOLSITE_APP/"

# Built for wasm32-wasip2, so it must stay out of any host workspace.
[workspace]

[package]
name = "mqtt-broker-handler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.51"
serde_json = "1"
# The fork of rumqttd 0.20.0 beside this crate: upstream's router, codecs
# and session state, driven by connection events. See ../FORK.md.
rumqttd = { path = "../rumqttd" }

[profile.release]
opt-level = "s"
strip = true

# Built for wasm32-wasip2, so it must stay out of any host workspace.
[workspace]

[package]
name = "duckdb-report-handler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.51"
serde_json = "1"
# Only the low-level writer and snappy, which is pure Rust (`snap`): no
# arrow, no zstd or brotli, nothing that needs a C compiler for wasm.
parquet = { version = "57", default-features = false, features = ["snap"] }

[profile.release]
opt-level = "s"
strip = true

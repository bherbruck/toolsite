[package]
name = "toolsite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = "0.8.9"
base64 = "0.22.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
cron = "0.17.0"
dotenvy = "0.15.7"
flate2 = "1.1.9"
maud = "0.27.0"
rand = "0.10.2"
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-streamable-http-server", "transport-io", "schemars"] }
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "limits"] }
rusqlite_migration = "2.6.0"
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
wasmtime = "47.0.3"
wasmtime-wasi = "47.0.3"
wasmtime-wasi-http = "47.0.3"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wat = "1.255.0"

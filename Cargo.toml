[package]
name = "toolsite"
version = "0.1.0"
edition = "2024"

[dependencies]
# Hands an app connector's path to its own router (`oneshot`).
tower = { version = "0.5.3", features = ["util"] }
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
cron = "0.17.0"
dotenvy = "0.15.7"
flate2 = "1.1.9"
maud = "0.27.0"
rand = "0.10.2"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server", "transport-io", "schemars"] }
# rustls plus bundled roots: no OpenSSL in the runtime image.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "webpki-roots", "charset", "stream", "json"] }
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "limits", "functions"] }
rusqlite_migration = "2.6.0"
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
wasmtime = "47.0.3"
wasmtime-wasi = "47.0.3"
wasmtime-wasi-http = "47.0.3"
rusty-s3 = "0.10"
futures-util = "0.3.34"
bytes = "1.12.1"
tokio-util = { version = "0.7.19", features = ["io"] }
jsonwebtoken = "9"
url = "2.5.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chromiumoxide = "0.9.1"
async-trait = "0.1.92"
resvg = { version = "0.48", default-features = false, features = ["text"] }
usvg = { version = "0.48", default-features = false, features = ["text", "writer"] }

# build.rs packs examples/ into tarballs the server embeds.
[build-dependencies]
flate2 = "1.1.9"
tar = "0.4.46"

[dev-dependencies]
tempfile = "3.27.0"
wat = "1.255.0"
